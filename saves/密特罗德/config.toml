[game]
name = "Metroid Dread" # 游戏名称
name-zh-cn = "密特罗德：恐惧" # 游戏名称中文
platform = "win10" # 运行平台：win10 linux mac android ios win7 winxp ns
path = 'switch' # 游戏路径
exe_path = 'switch' # 运行文件相对路径
save_path = 'D:\Games\Switch\Saves\Metroid Dread' # 存档文件相对路径，可以是文件夹或单文件
save_latest = true # 是否只保存save_path下最新创建的文件夹，用于游戏存档只增不减的情况
is_folder = false # 目标是否是文件夹，不然是单文件，只在save_latest为true时生效
need_zip = false # 是否需要压缩

[base]
download = "switch520" # steam，或下载地址/页面
